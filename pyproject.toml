[project]
name = "grabatus-service-core"
version = "0.1.0"
description = "Hexagonal core library for Grabatus computational services"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Grabatus", email = "contato@grabatus.com" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "google-cloud-storage>=2.18",
    "google-cloud-pubsub>=2.26",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-run>=0.10",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pybreaker>=1.2",
    "pyjwt>=2.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    'atheris>=2.3; sys_platform == "linux"',
    "mutmut>=2.5",
    "testcontainers>=4.8",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13,<1.14",  # pinned: pydantic.mypy plugin breaks on mypy>=1.14 (ExpandTypeVisitor)
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "sphinx>=8.0",
    "sphinx-autoapi>=3.3",
    "furo>=2024.8",
    "myst-parser>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grabatus_service_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "S", "ANN", "RUF",
    "PL", "PT", "TCH", "TID", "RET", "C4", "DTZ"
]
ignore = ["S101", "ANN101", "ANN102", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "PLR2004"]
# Ports are Protocol stubs; **kwargs on logger/observability methods are
# intentionally Any (the whole point of a structured-log abstraction is to
# accept arbitrary fields). ANN401 has no useful signal here.
"src/grabatus_service_core/ports/**/*.py" = ["ANN401"]
# Pydantic v2 needs runtime access to field annotations even when
# `from __future__ import annotations` is in effect — moving these imports
# under TYPE_CHECKING breaks model construction. Disable TC001/TC002/TC003
# for the contract package only.
"src/grabatus_service_core/contract/**/*.py" = ["TC001", "TC002", "TC003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# google-cloud-* libraries do not ship type stubs (no py.typed marker as of
# late 2025). Allow imports without forcing every adapter to add per-line
# ignores. Adapter source still calls typed surface (api_core exceptions
# imported from a sibling module that *does* have hints we control).
module = [
    "google.cloud.*",
    "google.api_core.*",
    "google.auth.*",
    "opentelemetry.exporter.cloud_trace",
    "opentelemetry.exporter.cloud_monitoring",
    "atheris",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests assert behavior on Pydantic frozen models by attempting to mutate them.
# Those `obj.field = x` lines are intentional contract violations; they raise
# at runtime. The corresponding `# type: ignore[misc]` was correct against
# older mypy/pydantic-mypy combinations but the current pair flags it as
# unused. Tests also exercise Literal-narrowed fields with literally-typed
# wrong values to confirm validation. None of this is production code.
module = ["tests.*"]
warn_unused_ignores = false
disable_error_code = ["assignment", "comparison-overlap", "union-attr", "call-overload", "arg-type", "call-arg"]
# disallow_any_explicit is intentionally NOT enabled: Pydantic v2 BaseModel exposes
# Any in inherited annotations (__pydantic_extra__, model_validate signatures).
# The pydantic.mypy plugin would provide field-level Any safety, but is incompatible
# with our pinned mypy 1.13.x — to be re-enabled when both can be upgraded together.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "gcp_real: requires real GCP project credentials",
    "slow: takes more than 1 second",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=grabatus_service_core",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["src/grabatus_service_core"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mutmut]
paths_to_mutate = "src/grabatus_service_core/"
runner = "uv run pytest tests/unit tests/property -x -q"
tests_dir = "tests/"
