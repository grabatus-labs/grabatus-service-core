[project]
name = "grabatus-service-core"
version = "0.1.0"
description = "Hexagonal core library for Grabatus computational services"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Grabatus", email = "contato@grabatus.com" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "google-cloud-storage>=2.18",
    "google-cloud-pubsub>=2.26",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-run>=0.10",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pybreaker>=1.2",
    "pyjwt>=2.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "atheris>=2.3",
    "mutmut>=2.5",
    "testcontainers>=4.8",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "sphinx>=8.0",
    "sphinx-autoapi>=3.3",
    "furo>=2024.8",
    "myst-parser>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grabatus_service_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "S", "ANN", "RUF",
    "PL", "PT", "TCH", "TID", "RET", "C4", "DTZ"
]
ignore = ["S101", "ANN101", "ANN102", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gcp_real: requires real GCP project credentials",
    "slow: takes more than 1 second",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=grabatus_service_core",
    "--cov-branch",
    "--cov-report=term-missing",
    # The 100% coverage gate is enabled in Phase G (Task G1).
    # During Phases A-F, coverage grows organically as modules are added.
    # Enabling --cov-fail-under=100 from day one would fail Task A2 because
    # there is no test code yet. The gate is enforced once the public API
    # is wired and every domain module is in place.
]

[tool.coverage.run]
branch = true
source = ["src/grabatus_service_core"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mutmut]
paths_to_mutate = "src/grabatus_service_core/"
runner = "uv run pytest tests/unit tests/property -x -q"
tests_dir = "tests/"
