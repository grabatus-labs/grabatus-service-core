name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: Verify tag matches pyproject version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          PYPROJECT_VERSION=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v${PYPROJECT_VERSION}" != "${GIT_TAG}" ]; then
            echo "Tag ${GIT_TAG} does not match pyproject version v${PYPROJECT_VERSION}" >&2
            exit 1
          fi

      - name: Run full quality gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy --strict src/ tests/
          uv run bandit -r src/ -ll
          uv run pytest

      - name: Build distribution
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${GIT_TAG}" \
            --title "${GIT_TAG}" \
            --generate-notes \
            dist/*
