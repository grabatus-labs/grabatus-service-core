name: CI (pre-merge)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pre-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (mutmut)
    if: contains(github.event.pull_request.labels.*.name, 'pre-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --extra dev

      # Both variables exist because mutmut's stats phase runs pytest itself
      # and ignores the `runner` key in pyproject.toml. See [tool.mutmut].
      - name: mutmut run
        env:
          PYTEST_ADDOPTS: "--no-cov"
          HYPOTHESIS_PROFILE: mutation
        # Surviving mutants are informative, not fatal — that is what `|| true`
        # is for. A mutmut that never ran IS fatal, and used to look exactly
        # the same: green job, empty report. The grep tells them apart.
        run: |
          set -o pipefail
          uv run mutmut run 2>&1 | tee mutmut-run.log || true
          if grep -q "failed to collect stats" mutmut-run.log; then
            echo "::error::mutmut aborted before evaluating a single mutant"
            exit 1
          fi

      - name: mutmut results
        env:
          PYTEST_ADDOPTS: "--no-cov"
          HYPOTHESIS_PROFILE: mutation
        run: |
          set -o pipefail
          uv run mutmut results | tee mutmut-results.txt
          if [ ! -s mutmut-results.txt ]; then
            echo "::error::mutmut produced no results — the gate evaluated nothing"
            exit 1
          fi

      - name: mutmut html
        run: uv run mutmut html

      - uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: html/

  real-gcp-integration:
    name: Real-GCP integration tests
    if: contains(github.event.pull_request.labels.*.name, 'pre-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_TEST_SA }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: pytest gcp_real marker
        env:
          GCP_PROJECT: ${{ vars.GCP_TEST_PROJECT }}
        run: uv run pytest -m gcp_real
