name: CI (pre-merge)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pre-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (mutmut)
    if: contains(github.event.pull_request.labels.*.name, 'pre-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: mutmut run
        run: uv run mutmut run || true

      - name: mutmut results
        run: uv run mutmut results

      - name: mutmut html
        run: uv run mutmut html

      - uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: html/

  real-gcp-integration:
    name: Real-GCP integration tests
    if: contains(github.event.pull_request.labels.*.name, 'pre-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_TEST_SA }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: pytest gcp_real marker
        env:
          GCP_PROJECT: ${{ vars.GCP_TEST_PROJECT }}
        run: uv run pytest -m gcp_real
