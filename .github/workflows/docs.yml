name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# No `pages: write` / `id-token: write`: this workflow builds the docs, it
# does not publish them. See issue #14 — the deploy job 404'd on every run
# since April because GitHub Pages was never enabled, and a permanently red
# check teaches everyone to ignore red. To publish, enable Pages in Settings
# and restore both the job and these permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: Build English site
        run: uv run sphinx-build -W -b html docs docs/_build/html/en

      - name: Build Portuguese site
        run: uv run sphinx-build -W -b html -D language=pt_BR docs docs/_build/html/pt_BR

      - name: Add bilingual landing redirect
        run: |
          cat > docs/_build/html/index.html <<'HTML'
          <!doctype html>
          <html><head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./en/">
            <title>grabatus-service-core</title>
          </head><body>
            <p>Redirecting to <a href="./en/">English documentation</a>.
            See also <a href="./pt_BR/">Portuguese (Brazilian)</a>.</p>
          </body></html>
          HTML

      # A plain artifact, not `upload-pages-artifact`: nothing deploys it to
      # Pages, and a Pages-shaped upload in a workflow that never reaches
      # Pages is how the dead deploy job survived four months unnoticed.
      # Kept so a reviewer can download and read the rendered docs.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14
